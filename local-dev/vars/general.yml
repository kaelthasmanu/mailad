---

# misc
timezone: "America/Havana"
domain: mailad.cu
mailad_at: /home/manuel/Desktop/Projects/mailad/

# repo sources
# I use a local nginx reverse proxy to cache all the files downloaded to speedup the process
# if you want to use the official mirrors, just change the host to archive.ubuntu.com and deb.debian.org and remove the port
repos:
  arch: amd64
  ubuntu:
    host: archive.ubuntu.com
    port: 
  debian:
    host: deb.debian.org
    port: 

# Network
lxc_network:
  subnet: 10.0.3
  gateway: 10.0.3.1

lxc_dns:
  - 9.9.9.9
  - 1.1.1.1

# LXCs data
# Warn: host must match that on the inventory
lxcs:
  dc:
    distro: ubuntu
    release: noble
    host: 10.0.3.2
  mailur:
    distro: ubuntu
    release: resolute
    host: 10.0.3.3
  maild:
    distro: debian
    release: trixie
    host: 10.0.3.4
  mailun:
    distro: ubuntu
    release: noble
    host: 10.0.3.6
  test:
    distro: ubuntu
    release: noble
    host: 10.0.3.5
