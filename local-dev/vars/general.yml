# General variables
#
# Notes:
# - 
#

---

# misc
timezone: "America/Havana"
domain: mailad.cu
mailad_at:  # path to the mailad folder on the host, will be mounted inside the containers, must be an absolute path

# repo sources
# I use a local nginx reverse proxy to cache all the files downloaded to speedup the process
# if you want use a local repo, add the port and address to the repo
repos:
  arch: amd64
  ubuntu:
    host: archive.ubuntu.com
    port: #add port if using a local repo 
  debian:
    host: deb.debian.org
    port: #add port if using a local repo 

# LXCs data
# Warn: host must match that on the inventory
lxcs:
  dc:
    distro: ubuntu
    release: noble
    host: 10.0.3.2
  mailur:
    distro: ubuntu
    release: resolute
    host: 10.0.3.3
  maild:
    distro: debian
    release: trixie
    host: 10.0.3.4
  mailun:
    distro: ubuntu
    release: noble
    host: 10.0.3.6
  test:
    distro: ubuntu
    release: noble
    host: 10.0.3.5
